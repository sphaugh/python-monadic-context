name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["pypy3.10", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # Poetry itself no longer installs on 3.9 / pypy3.10, so CI uses plain pip.
      - name: Install dev dependencies
        run: pip install -e . pytest pytest-cov hypothesis
      - name: Run tests
        run: pytest
      - name: Type-check layer inference
        if: matrix.python-version == '3.13'
        uses: jakebailey/pyright-action@v2
        with:
          extra-args: monadic_context tests/typing
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v3
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
